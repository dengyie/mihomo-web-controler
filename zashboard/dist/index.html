<script>
// Retire the old PWA cache so patched panel assets are fetched from the VPS.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then((items) => {
    for (const item of items) {
      if (item.scope.includes('/panel/')) item.unregister()
    }
  }).catch(() => {})
}
if ('caches' in window) {
  caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key)))).catch(() => {})
}
</script>
<script>
// Auto-seed tebi and pxed dual backends if not present.
try {
  const apiKey = 'setup/api-list'
  const activeKey = 'setup/active-uuid'
  let list = JSON.parse(localStorage.getItem(apiKey) || '[]')
  if (!Array.isArray(list)) list = []

  const tebiUuid = 'backend-tebi-default'
  const pxedUuid = 'backend-pxed-default'

  let hasTebi = list.some((x) => x && (x.label === 'tebi' || x.secondaryPath === '/panel/api' || x.secondaryPath === '/panel/tebi/api'))
  let hasPxed = list.some((x) => x && (x.label === 'pxed' || x.secondaryPath === '/panel/pxed/api'))

  if (!hasTebi) {
    list.unshift({
      type: 'clash',
      protocol: 'https',
      host: '3x-ui.mangoqwq.com',
      port: '443',
      secondaryPath: '/panel/api',
      password: '__PANEL_PASSWORD__',
      uuid: tebiUuid,
      label: 'tebi',
      disableUpgradeCore: true,
      disableTunMode: true,
    })
  }

  if (!hasPxed) {
    list.push({
      type: 'clash',
      protocol: 'https',
      host: '3x-ui.mangoqwq.com',
      port: '443',
      secondaryPath: '/panel/pxed/api',
      password: '__PANEL_PASSWORD__',
      uuid: pxedUuid,
      label: 'pxed',
      disableUpgradeCore: true,
      disableTunMode: true,
    })
  }

  // Refresh the credential on any EXISTING tebi/pxed entry to the injected
  // (current) panel password. Without this, a browser that visited before the
  // hardcoded-password removal keeps sending the stale old secret in its
  // localStorage, the gateway now rejects it (401), and the UI shows no success
  // feedback even though the rule was saved. This makes the seed self-healing
  // on every page load.
  const injectedPw = '__PANEL_PASSWORD__'
  for (const entry of list) {
    if (entry && (entry.label === 'tebi' || entry.label === 'pxed' ||
        entry.secondaryPath === '/panel/api' || entry.secondaryPath === '/panel/pxed/api' ||
        entry.secondaryPath === '/panel/tebi/api')) {
      entry.password = injectedPw
    }
  }

  localStorage.setItem(apiKey, JSON.stringify(list))
  if (!localStorage.getItem(activeKey)) {
    localStorage.setItem(activeKey, list[0].uuid)
  }
} catch (_) {}
</script>

    <script>
// Panel-only latency defaults for Hutao-compatible independent checks.
try {
  const speedKey = 'config/speedtest-url'
  const oldGoogle = 'https://www.gstatic.com/generate_204'
  const oldIp = 'https://1.1.1.1/cdn-cgi/trace'
  const nextUrl = 'https://cloudflare.com/cdn-cgi/trace'
  const current = localStorage.getItem(speedKey)
  if (!current || current === oldGoogle || current === oldIp || current === JSON.stringify(oldGoogle) || current === JSON.stringify(oldIp)) {
    localStorage.setItem(speedKey, nextUrl)
  }
  localStorage.setItem('config/independent-latency-test', 'true')
  const groupKey = 'config/group-test-urls'
  const groups = JSON.parse(localStorage.getItem(groupKey) || '[]')
  for (const name of ['♻️ 自动选择', '♻️Grok优选']) {
    const item = groups.find((x) => x && x.name === name)
    if (item) item.url = nextUrl
    else groups.push({ name, url: nextUrl })
  }
  localStorage.setItem(groupKey, JSON.stringify(groups))
} catch (_) {}
</script>
